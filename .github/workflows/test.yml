name: Tests

on:
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/test.yml'
      - 'api/**'
      - 'insforge/functions/**'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/test.yml'
      - 'api/**'
      - 'insforge/functions/**'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Edge Function tests
        run: deno test supabase/functions/ --allow-env --allow-net

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run Node.js tests
        run: npm ci && npm test
